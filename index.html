<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        
        <title>Library</title>
    </head>
    <body>
        <h1>Welcome to Isaac's Library</h1>
        <p>Please enjoy all the books we have on offer</p>

        <ul id="bookList"></ul>

        <p>Please feel free to add more books to our library by using the form below:</p>

        
        <button onclick="makeFormVisible()">New Book</button><br>

        <input type="text" id="titleInput" placeholder="Title"><br>
        <input type="text" id="authorInput" placeholder="Author"><br>
        <input type="number" id="pagesInput" placeholder="Number of pages" min="1"><br>
        <input type="checkbox" id="bookRead"> <label id="bookReadLabel" for="bookRead">Book read?</label><br>

        <button onclick="addBookToLibrary()">Add Book</button>

        <script src="script.js"></script>
    </body>
</html>
